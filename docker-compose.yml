services:
  db:
    image: postgres:16-alpine
    container_name: carpinteria-db
    environment:
      POSTGRES_DB: carpinteria
      POSTGRES_USER: carpinteria
      POSTGRES_PASSWORD: carpinteria
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: